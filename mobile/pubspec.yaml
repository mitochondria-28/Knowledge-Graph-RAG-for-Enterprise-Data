name: enterprise_kg_rag
description: Enterprise Knowledge Graph RAG — AI-powered document Q&A
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  dio: ^5.7.0
  http_parser: ^4.0.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Auth
  google_sign_in: ^6.2.1

  # File handling
  file_picker: ^8.1.2

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.3
  percent_indicator: ^4.2.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0

  # Routing
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
