[project]
name = "enterprise-kg-rag"
version = "0.1.0"
description = "Enterprise Knowledge Graph RAG Assistant"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.7",
    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.2.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # HTTP client (Google OAuth token verification)
    "httpx>=0.24.0",
    # LLM & orchestration
    "google-genai>=2.0.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # Configuration & validation
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    # Tokenization
    "tiktoken>=0.7.0",
    # PDF parsing
    "pypdf>=4.0.0",
    # CLI & display
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Observability
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    # Fuzzy matching
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
# Phase 4+: Neo4j
graph = ["neo4j>=5.20.0"]
# Phase 5+: PostgreSQL + pgvector
vector = ["psycopg[binary]>=3.1.0", "pgvector>=0.3.0"]
# Phase 5+: Embeddings
embed = ["openai>=1.40.0"]
# Testing
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    # Observability deps (Phase 11)
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
]
# Everything
all = [
    "enterprise-kg-rag[graph,vector,embed,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Test markers — run subsets with: pytest -m unit / -m integration / -m property
markers = [
    "unit: fast, isolated unit tests (no I/O)",
    "integration: full pipeline wired together (may read output/all_chunks.json)",
    "property: Hypothesis property-based tests",
    "api: FastAPI HTTP endpoint tests",
    "slow: tests that take >1s (excluded from quick-check runs)",
]
# Default addopts — show short traceback, verbose on failure, no header noise
addopts = "-ra --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/*/migrations/*",
    "src/config.py",
]

[tool.coverage.report]
# Lines that are pragmatically excluded from coverage
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff.lint]
select = ["E", "F", "I"]
