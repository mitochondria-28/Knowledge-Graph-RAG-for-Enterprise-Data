[project]
name = "enterprise-kg-rag"
version = "0.1.0"
description = "Enterprise Knowledge Graph RAG Assistant"
requires-python = ">=3.11"
dependencies = [
    # LLM & orchestration
    "anthropic>=0.34.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-anthropic>=0.2.0",
    # Configuration & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    # Tokenization
    "tiktoken>=0.7.0",
    # CLI & display
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Phase 4+: Neo4j
graph = ["neo4j>=5.20.0"]
# Phase 5+: PostgreSQL + pgvector
vector = ["psycopg[binary]>=3.1.0", "pgvector>=0.3.0"]
# Phase 5+: Embeddings
embed = ["openai>=1.40.0"]
# Testing
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
# Everything
all = [
    "enterprise-kg-rag[graph,vector,embed,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
